spring.application.name=Reviser

# --- Server ---
# Render (and most PaaS) inject the port to bind via $PORT.
server.port=${PORT:8080}

# --- Datasource (externalized; local Postgres defaults for dev) ---
# On Render, set SPRING_DATASOURCE_URL to the JDBC form of the managed DB's
# connection string, e.g. jdbc:postgresql://<host>:5432/<db>
# (the bare postgresql:// form will NOT parse).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Reviser}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgresql}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

# --- Gemini AI (externalized; NEVER commit a real key) ---
# Set GEMINI_API_KEY in the environment. When it is empty the app still runs,
# falling back to neutral offline planning instead of live Gemini calls.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Actuator endpoints are served by their own handler mapping, so the global
# WebMvc CORS config in WebConfig does NOT apply to them. Without this, the
# frontend's /actuator/health check is blocked by CORS in local dev
# (5173 -> 8080) and the status indicator is stuck on "Connecting..." even
# when the backend is healthy. In production the SPA is same-origin, so this
# is a no-op there.
management.endpoints.web.cors.allowed-origin-patterns=*
management.endpoints.web.cors.allowed-methods=GET
